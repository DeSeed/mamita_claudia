<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Feliz Día de la Madre 🌸</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,700;1,400&family=Lato:wght@300;400&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/welcome.css">
</head>
<body>

  <script>
    window.CARD_CONFIG = {
      recipientName   : "Mamita Claudia",
      senderName      : "De tu hija Claudia que te ama mucho",
      welcomeHeadline : "Feliz Día de la Madre",
      welcomeSubtitle : "Un pequeño regalo lleno de todo mi amor para ti.",
      enterButtonText : "Abrir mi tarjeta 🌸",
      cardUrl         : "card.html",
      primaryColor : "#d8b4fe",
accentColor  : "#9333ea",
textColor    : "#2e1065",
      welcomeBg       : "https://images.unsplash.com/photo-1490750967868-88df5691166a?w=1600&q=80",
      musicUrl        : "assets/Cancion.mp3",
      musicAutoplay   : true,
      musicLoop       : true,
      particles       : true,
    };
  </script>

  <!-- Overlay de transición (negro → invisible al entrar, invisible → negro al salir) -->
  <div class="page-transition" id="js-page-transition"></div>

  <canvas id="particles-canvas"></canvas>

  <div class="welcome-wrapper">
    <div class="petal-ring" aria-hidden="true">
      <span></span><span></span><span></span><span></span>
      <span></span><span></span><span></span><span></span>
    </div>

    <header class="welcome-header">
      <div class="badge">✦ Para ti ✦</div>
      <h1 class="headline" id="js-headline"></h1>
      <p class="subtitle" id="js-subtitle"></p>
    </header>

    <div class="envelope-scene" id="js-envelope">
      <div class="env-flap"></div>
      <div class="env-body">
        <div class="env-heart">♥</div>
      </div>
    </div>

    <button class="enter-btn" id="js-enter-btn" aria-label="Abrir tarjeta">
      <span id="js-btn-text"></span>
      <svg class="btn-arrow" viewBox="0 0 24 24"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
    </button>

    <footer class="welcome-footer">
      <span id="js-sender"></span>
    </footer>
  </div>

  <audio id="bg-music" loop></audio>
  <script src="js/welcome.js"></script>
</body>
</html>
